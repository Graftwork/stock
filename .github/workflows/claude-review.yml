name: Claude Code Review

# Automatically review pull requests with Claude when they are opened or marked
# ready for review. Authentication uses a Claude subscription OAuth token stored
# in the CLAUDE_CODE_OAUTH_TOKEN repository secret, so reviews draw on the
# existing Claude plan rather than a separate Anthropic API key.
on:
  pull_request:
    types: [opened, ready_for_review]

# Cancel an in-progress review when the same pull request triggers another run,
# so a single PR never consumes subscription quota on overlapping reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft pull requests; they are reviewed once marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required alongside --comment: the action only starts the MCP server that
          # posts inline PR comments when --allowedTools names it here explicitly.
          # The code-review skill's own allowed-tools frontmatter naming the same
          # tool is not sufficient on its own.
          #
          # `Bash(gh pr comment:*)` is required too, for a different reason: per the
          # command's own source (anthropics/claude-code, plugins/code-review/commands/
          # code-review.md), a clean review with no issues posts its "No issues found"
          # summary via `gh pr comment`, not the inline-comment tool above. Confirmed
          # by a live run grafting this workflow onto stiffneckjim/comic-book-guy (PR #7)
          # that completed with permission_denials_count: 1 and posted nothing — the
          # review ran for real (21s, 5 turns) and found nothing to flag, but was
          # blocked from posting that outcome at all. Re-run with this fix on PR #9 of
          # the same repo posted the "No issues found" comment successfully.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
          # Dependabot PRs only ever touch dependency-pin lines (pyproject.toml, devcontainer
          # feature versions), so they carry no attacker-controlled content; allow the action to
          # run for them rather than failing every dependency-bump PR's review check.
          allowed_bots: "dependabot"
