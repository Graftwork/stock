name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads mise.toml, so CI and a laptop run the same pinned versions.
      # The mise binary itself is pinned too (`version`), for two measured
      # reasons. Left to resolve "latest", the action calls the GitHub API, and
      # a brand-new release has failed twice: CI failed on PR #14 with
      # `curl: (22) ... 404` fetching mise-v2026.9.2-linux-x64.tar.zst right
      # after that release went out; and on PR #57 `mise self-update` to
      # 2026.9.17 was rate limited (HTTP 403, unauthenticated) when the cache
      # held 2026.9.12, before any step of ours ran. A pinned version skips that
      # resolution, and `minimum_release_age` (which the action applies only
      # when `version` is not set, per its action.yml) is no longer needed.
      # 2026.9.12 is the version this repository's cache already held, installed
      # by earlier runs. To upgrade, change `version` here, once the release is a
      # few days old, and check the first CI run on a cold cache.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.12
          cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Non-blocking on purpose: a freshly stamped repo is green before
      # CODECOV_TOKEN exists. Add the secret and the badge goes live.
      # See docs/decisions/0003-coverage-reporting.md.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
