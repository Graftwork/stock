# Run with: uvx pre-commit run --all-files
# Install the git hook with: uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The review-layer contract, enforced before a commit rather than after.
      - id: spec-traceability
        name: every spec scenario is claimed by a test
        entry: python scripts/check_spec_traceability.py
        language: system
        pass_filenames: false
        files: ^(openspec/specs/|tests/)
